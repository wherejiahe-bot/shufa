  <script>const LUN = [
 {t:"第一 住庵", x:"凡出家者，先须投庵。庵者，舍也，一身依倚。身有依倚，心渐得安，气神和畅，入真道矣！凡有动作，不可过劳，过劳则损气；不可不动，不动则气血凝滞，须要动静得其中，然后可以守常安分，此是住庵之法。"},
 {t:"第二 云游", x:"凡游历之道有二：一者看山水明秀、花木之红翠，或玩州府之繁华，或赏寺观之楼阁，或寻朋友以纵意，或为衣食而留心，如此之人，虽行万里之途，劳形费力，遍览天下之景，心乱气衰，此乃虚云游之人。二者，参寻性命，求问妙玄，登巇崄之高山，访明师之不惓，渡喧轰之远水，问道无厌。若一句相投，便有圆光内发，了生死之大事，作全真之丈夫。如此之人，乃真云游也！"},
 {t:"第三 学书", x:"学书之道，不可寻文而乱目，当宜采意以合心。舍书探意、采理，舍理采趣，采得趣，则可以收之入心，久久精诚，自然心光洋溢，智神踊跃，无所不通，无所不解。若到此，则可以收养，不可驰骋耳，恐失于性命。若不穷书之本意，只欲记多念广，人前谈说，夸讶才俊，无益于修行，有伤于神气，虽多看书，与道何益？既得书意，可深藏之。"},
 {t:"第四 论合药", x:"药者，乃山川之秀气，草木之精华。一温一寒，可补可泄；一厚一薄，可表可托。肯精学者，活人之性命；若盲毉者，损人之形体。学道之人，不可不通；若不通者，无以助道。不可执著，则有损于阴功，外贪财货，内费修真，不足今生招愆，切忌来生之报，吾门高弟，仔细参详。"},
 {t:"第五 论盖造", x:"茅庵草舍，须要遮形，露宿野眠，触犯日月。茍或雕梁峻宇，亦非上士之作为；大殿高堂，岂是道人之活计。斫伐树木，断地脉之津液；化道货财，取人家之血脉。只修外功，不修内行，如画饼充饥，积雪为粮，虚劳众力，到了成空。有志之人，早当觅身中宝殿，体外朱楼，不解修完，看看倒塌。聪明君子，细细察详。"},
 {t:"第六 论合道伴", x:"道人合伴，本欲疾病相扶，你死我埋，我死你埋。然先择人而后合伴，不可先合伴而后择人。不可相恋，相恋则系其心；不可不恋，不恋则情相离。恋与不恋，得其中道可矣！有三合三不合：明心、有慧、有志，此三合也。不明著外境，无智慧性愚浊，无志气干打哄，此三不合也。立身之本在丛林，全凭心志，不可顺人情，不可取相貌，唯择高明者，是上法也。"},
 {t:"第七 论打坐", x:"凡打坐者，非言形体端然，瞑目合眼，此是假坐也。真坐者，须十二时辰，住行坐卧，一切动静中间，心如泰山，不动不摇，把断四门，眼耳口鼻，不令外景入内，但有丝毫动静思念，即不名静坐。能如此者，虽身处于尘世，名已列于仙位，不须远参他人，便是身内圣贤。百年功满，脱壳登真，一粒丹成，神游八表。"},
 {t:"第八 论降心", x:"凡论心之道，若常湛然，其心不动，昏昏默默，不见万物，冥冥杳杳，不内不外，无丝毫念想，此是定心，不可降也。若随境生心，颠颠倒倒，寻头觅尾，此名乱心也，速当剪除，不可纵放，败坏道德，损失性命。住行坐卧，常勤降闻见知觉，无病患矣！"},
 {t:"第九 论炼性", x:"理性如调琴，弦紧则有断，慢则不应，紧慢得中，琴可调矣！则又如铸剑，钢多则折，锡多则卷，钢锡得中，则剑可铸矣；炼性者，体此二法，则自妙也。"},
 {t:"第十 论匹配五气", x:"五气聚于中宫，三元攒于顶上，青龙喷赤雾，白虎吐乌烟。万神罗列，百脉流冲，丹砂晃朗，铅汞凝澄，身且寄向人间，神已游于天上。"},
 {t:"第十一 论混性命", x:"性者神也，命者气也。性若见命，如禽得风，飘飘轻举，省力易成。《阴符经》云：“禽之制在气”，是也。修真之士，不可不参，不可渗漏于下士，恐有神明降责。性命是修行之根本，谨紧锻炼矣！"},
 {t:"第十二 论圣道", x:"入圣之道，须是苦志多年，积功累行，高明之士，贤达之流，方可入圣之道也。身居一室之中，性满乾坤，普天圣众，默默护持，无极仙君，冥冥围绕。名集紫府，位列仙阶，形且寄于尘中，心已明于物外矣！"},
 {t:"十三 论超三界", x:"欲界、色界、无色界，此乃三界也。心忘虑念，即超欲界；心忘诸境，即超色界；不着空见，即超无色界；离此三界，神居仙圣之乡，性在玉清之境矣！"},
 {t:"第十四 论养身之法", x:"法身者，无形之相也。不空不有，无后无前，不下不高，非短非长。用则无所不通，藏之则昏默无迹。若得此道，正可养之；养之多则功多，养之少则功少。不可愿归，不可恋世，去住自然矣！"},
 {t:"第十五 论离凡世", x:"离凡世者，非身离也，言心地也。身如藕根，心似莲花，根在泥而花在虚空矣！得道之人，身在凡而心在圣境矣！今之人，欲永不死而离凡世者，大愚不达道理也！言十五论者，警门中有志之人，深可详察知之。"}
];

const PER_COL = 12;
const COLS_PER_PAGE = 8;
function allChars(){
  const arr=[];
  const isPunct = c => /\p{P}/u.test(c);
  LUN.forEach(it=>{
    Array.from(it.t).forEach(c=>{ if(c.trim()!=='' && !isPunct(c)) arr.push(c); });
    Array.from(it.x).forEach(c=>{ if(c.trim()!=='' && !isPunct(c)) arr.push(c); });
  });
  return arr;
}
const state={total:1,cur:0};
function build(){
  const chars=allChars();
  const perPage=PER_COL*COLS_PER_PAGE;
  const contentPages=Math.ceil(chars.length/perPage);
  const wrap=document.getElementById('content-pages');
  wrap.innerHTML='';
  for(let p=0;p<contentPages;p++){
    const pg=document.createElement('div');
    pg.className='page';
    pg.dataset.page=String(p+1);
    const grid=document.createElement('div');
    grid.className='grid';
    const start=p*perPage;
    const slice=chars.slice(start,start+perPage);
    for(let c=0;c<COLS_PER_PAGE;c++){
      const colChars=slice.slice(c*PER_COL,(c+1)*PER_COL);
      if(colChars.length===0) break;
      const col=document.createElement('div');
      col.className='col';
      colChars.forEach(ch=>{
        const s=document.createElement('span');
        s.className='ch';
        s.textContent=ch;
        col.appendChild(s);
      });
      grid.appendChild(col);
    }
    pg.appendChild(grid);
    wrap.appendChild(pg);
  }
  state.total=contentPages+1;
  showPage(0);
}
function showPage(n){
  n=Math.max(0,Math.min(state.total-1,n));
  state.cur=n;
  document.querySelectorAll('.page').forEach(p=>{
    p.classList.toggle('active', p.dataset.page===String(n));
  });
  document.getElementById('pageLabel').textContent='第 '+(n+1)+' / '+state.total+' 页';
  window.scrollTo(0,0);
}
build();
const inkBtn=document.getElementById('inkBtn');
const ruleBtn=document.getElementById('ruleBtn');
const prevBtn=document.getElementById('prevBtn');
const nextBtn=document.getElementById('nextBtn');
const sizeRange=document.getElementById('sizeRange');
inkBtn.onclick=()=>{document.body.classList.toggle('ink');inkBtn.classList.toggle('on');};
ruleBtn.onclick=()=>{document.body.classList.toggle('no-rule');ruleBtn.classList.toggle('on');};
prevBtn.onclick=()=>showPage(state.cur-1);
nextBtn.onclick=()=>showPage(state.cur+1);
sizeRange.oninput=(e)=>{document.documentElement.style.setProperty('--cell',e.target.value+'px');};
</script>
