<title>重阳真人金关玉锁诀 · 柳公权楷书集字临摹帖</title>
<style>
  :root{
    --paper:#f7f1e3;
    --ink:#26221c;
    --grid:rgba(178,86,72,.42);
    --grid-thin:rgba(178,86,72,.18);
    --cell:64px;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:"LiuGongQuan","LiuGongQuan","FZLiuGQK--GBK1-0","方正柳公权楷书","LXGW WenKai","STKaiti","KaiTi","楷体",serif;
    padding-bottom:60px;
  }
  .toolbar{position:sticky;top:0;z-index:9;background:rgba(247,241,227,.94);border-bottom:1px solid #d8cdb4;padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px;}
  .toolbar button{border:1px solid #a89678;background:#fbf7ec;color:#4a3f2e;padding:6px 14px;border-radius:4px;cursor:pointer;font-size:14px;font-family:inherit;letter-spacing:2px;}
  .toolbar button.on{background:#7a2f23;color:#f7f1e3;border-color:#7a2f23;}
  .toolbar label{display:flex;align-items:center;gap:6px;color:#6b5d45;}
  .toolbar input[type=range]{width:120px;}
  header{text-align:center;padding:42px 16px 10px;}
  header h1{font-size:50px;letter-spacing:12px;font-weight:400;text-indent:12px;}
  header .sub{margin-top:14px;font-size:15px;letter-spacing:5px;color:#8a7a5c;display:flex;justify-content:center;gap:14px;}
  header .seal{display:inline-block;background:#a03024;color:#f7f1e3;font-size:13px;letter-spacing:3px;padding:4px 7px;border-radius:2px;writing-mode:vertical-rl;line-height:1.3;}
  .note{text-align:center;color:#9a8a68;font-size:13px;letter-spacing:1px;margin:14px auto 0;max-width:660px;line-height:1.8;}
  main{max-width:920px;margin:26px auto 0;padding:0 16px;}
  section{margin-bottom:48px;}
  .lun-title{font-size:28px;letter-spacing:8px;margin-bottom:18px;display:flex;align-items:center;gap:16px;}
  .lun-title::after{content:"";flex:1;height:1px;background:linear-gradient(to right,#c9b892,transparent);}
  .fanwen{line-height:0;}
  .ch{display:inline-block;width:var(--cell);height:var(--cell);line-height:var(--cell);text-align:center;font-size:calc(var(--cell) * .78);margin:.06em 0;position:relative;vertical-align:top;
    background:
      linear-gradient(to right,  transparent calc(50% - .5px), var(--grid-thin) calc(50% - .5px), var(--grid-thin) calc(50% + .5px), transparent calc(50% + .5px)),
      linear-gradient(to bottom, transparent calc(50% - .5px), var(--grid-thin) calc(50% - .5px), var(--grid-thin) calc(50% + .5px), transparent calc(50% + .5px)),
      linear-gradient(45deg,  transparent calc(50% - .4px), var(--grid-thin) calc(50% - .4px), var(--grid-thin) calc(50% + .4px), transparent calc(50% + .4px)),
      linear-gradient(135deg, transparent calc(50% - .4px), var(--grid-thin) calc(50% - .4px), var(--grid-thin) calc(50% + .4px), transparent calc(50% + .4px));
    box-shadow:inset 0 0 0 1px var(--grid);}
  body.no-grid .ch{background:none;box-shadow:none;}
  body.trace .fanwen{color:rgba(70,60,45,.22);}

 {t:'第五',x:'问曰何者是神仙抱一抱一者天下人身之根本一者是万物之根本一者为道也昔为初一者真水也水中生气气中生水万物者从一生万物是长养一生二二生三三生万物三中四智功五眼恁起六根扫荡七魄运开八卦说九思真道凭无漏果圆融意想自神长在丹田抱守元炁莫教散失此者是抱一之法'},

 {t:'第七',x:'问曰何者是强兵战胜诀曰夫战胜者天下少人知夫战胜是常之法难曰既论清静之法何得说战胜理解曰今人不达战胜之法又能治于病疾无常战胜者第一先战退无名烦恼第二夜间境中要战退三尸阴鬼第三战退万法此者是战胜之法若人会得三乘者变殃恼为福也夫修行者常清静为根本大乘之法欲为大乘者需索从小乘而起清不离浊动不离静静中便生动浊中便自有清有天地有日月有水火有阴阳谓之真道经云纯阳而不生纯阴而不长阴阳和合者能生万物今人修道者却不修真道道者了达性命也性命者是精血也人有万病是病者皆伤人之命矣有疾病者尽不干五脏之事都是损了精气血三宝欲要安乐长生者除是持清静之识或有未出家之人年少时不能持清静之果从小乘入中乘上乘初地达法心为小乘觉悟者为中乘了达者为上乘第一是化城第二市银城第三是金城似一根大树先有其根后有其梢如常时只宜清静大为正道也'},
 {t:'第八',x:'问曰假令一身清静却逢天魔之日如何治之又假令逢外道波巡请问如何治之答曰波巡者界也境界皆有只要识进退三要辨清浊若逢阴阳者加火入水却浊不相煎之法诀曰假令魔军来时急须准备检三千强兵诀曰三千疏真功强兵者为其气也有来无去千息数积其气在丹田不散只教暖不教冷自结胎仙为妙法也若人得如上妙者永得如上真功功成果满永得安乐长生一切修功之人临有难之日小心准备'},

 {t:'第十一',x:'问曰假令白牛去时如何擒捉诀曰白牛去时紧扣玄关牢镇四门急用先人钓鱼之法又用三岛手印指黄河逆流掩上金关纳合玉锁如人斩眼白牛自然不走名机出水登彼岸之法有十般定性命之法诀曰一名金关玉锁定二名三岛回生换死定三名九曲黄河逆流定是名无漏果圆者皆共成于仙道若定了宝时休教滞了腰脚昏了眼目此是定三宝之法'},

 {t:'第十三',x:'问曰既刀圭何者言为一粒刀圭何者自饮刀圭何者为铁离刀圭诀曰三刀圭者为宝也是精气血也诀曰一粒刀圭者津液自饮刀圭者咽津服炁铁离刀圭者是真炁行功不退变万邪皈正如行功时饥食金飰渴饮玉浆冷时进火热时进水火者是真阳水者是真阴此功者是抽添加减之法诀曰抽者从上收真炁添者从下进暖炁入丹田若人肾宫暖者万病消除'},
 {t:'第十四',x:'问曰男子女人忽时便有疾病无常何如也答曰为一切男子女人心着欲乐贪恋境界之争白日不断无名烦恼夜间静中不能断三尸阴鬼男子损却精女人损却血炁三宝走却元阳故乃人有疾病无常也不闻神仙之语人似破漏房屋主人不修补者宫殿倒塌坏其梁柱是人有疾病无常者难曰因甚小儿清静不损三宝亦有疾病无常者因母血气亏若受母十月胎气不足又或犯风淫暑湿四集不忌受胎小儿故有疾病无常也'},
 {t:'第十五',x:'问曰因甚有丑好之人何谓也诀曰貌正者是日父母二气感应日月午时以前丑时以后便得端正真实长命有衣禄貌正得父母喜悦之心午时以后丑时以前受胎有一貌不正者或病聋喑痖多性劣不得人意命穷无衣禄寿命不长也此是造化之根本也'},
 {t:'第十六',x:'问曰假令逢冤魔者如何治之诀曰宜清静忙中偷闲闲中取静若人有难之时急须回避心王须用灌想之法急驱神意入上泥丸神宫正坐意想眼前见仙男仙女各动仙乐叩齿定意看昆仑山景见上牛羊鹿马玉兔意想上拿住系定功时忽思上有一宝树树上有花花开结子意摘取吞之是吃了此物者永得安乐长生此是修正法一句了然大牢镇四门诀曰血海命门气定无开闭户精定不思外境神定精血散者是性命也一意者为真主人也齿是为玄关闭丹田者为下玄关提金精上玄者为金关紧叩齿者为玉锁六根不动者是六度号都关下纳气为勒阳关上腮为顶阳关鼻为天门夹眷为双关行功之时一齐开锁神不动者意不乱也意者恍惚也此是清静之法也及春夏秋冬但小儿小便黄色者是丹田虚败失却下元存真炁急用穿九曲之法又名九转穿小肠九透真炁入肾堂小便自然清白色也一身便得安乐'},
 {t:'第十七',x:'问曰何者是三乘之法诀曰下乘者如新生孩儿中乘者如小儿坐地上乘者如小儿行走若通此三乘便超三界欲界色界无色界是心性意显具三身清静法身圆满报身三昧化身三者各有显迹之神第一会太上炼甲乙木是虚坦会老君著青衣度三千青衣道士者转青神黄卷三十六部灵宝尊经留下九转丹黄芽穿膝之法绝国第二会释迦佛留下炼南方丙丁火身被烈火袈裟三千赤子比丘僧人留下十二部大乘尊经射九重铁鼓之法芦芽穿膝之法龙华三会夫子在鲁国之习学堂炼西方庚辛金三千白衣居士留下十卷论语并穿九曲明珠芦芽穿膝之法三教者如鼎三足身同归一无二无三三教者不离真道也喻曰似一根树生三枝也'},
 {t:'第十八',x:'问曰大道之中离几等神仙解曰闻传道集中有五等神仙第一不持戒不断酒肉不杀生不思善为鬼仙之类第二养真气长命者为地仙第三好战争是剑仙第四打坐修行者为神仙第五孝养师长父母六度万行方便救一切众生断除十恶不杀生不食酒肉邪非偷盗出意同天心正直无私曲名曰天仙当日初发善心处便是吉祥之地为善法大修行人后有禁忌之文诀曰男女五月六月宜清静大忌十一月十二月宜清静又男子五月六月大杀之月勿近妇人为五劳七伤男损性命女人损性者是精血气也损者令人左瘫右痪赤白带下若损五行真气为劳损七宝为伤万病者各有来处'},
 {t:'第十九',x:'问曰病从何生诀曰万病皆从八节不正之气而生'},
 {t:'第二十',x:'问曰何者八邪诀曰八卦中阴阳不顺是八节中气令人入邪者是饥饱劳役风寒暑湿饥来痛饱寒极忧心远行困倦及冷热身醉亦不可行功变成大病也宜清静行之行时舌上收玉液丹鼻中收元阳丹肾堂中收金液丹如精髓满骨实者死经百年筋骨不解名为连子环镇骨诀曰二十四忌大丹者是一年二十四炁上令告我师愿求妙诀须索意自息肯舍重金净财第一舍身布施第二将花献师第三令膳而供养解曰舍身布施者若见师长父母危时舍命求命将花献师者若师长须打骂须将喜笑迎之面上无嗔怒令膳而供养者食有好味先奉其师此名三布施也仙人言曰坚者为道欢喜者为缘若求师不勤岂至于道吕翁曰不因师指此事难知又云学而不知者不学而悟之学而不从师名为盗学也是法中贼若掩祖上师得促自己寿与常人同例自扬己得是断行做作此人可以成道乎其人谓轻师慢法不堪为师未学修行先持救济他人者为救自己者凭功德行人各认祖宗科牌太上为祖释迦为宗夫子为科牌自从三教既寂以后一切男女在爱河内煎煮苦海漂沉受其烦恼六道沉沦不生不落去住三教圣主三界圣母却来救度儿女名号记显现分明寿印信为其勘同解曰一身为全受戒者为记心悟了达者为火随求经云如意宝印从心显名为号有十号者为十善十号者为能人一号元修二号转分明三号通三界四号长生五号光明现六号意通七号全身主八号福禄增九号天元修十号者为能人一加性十号无漏功德自然成三教者是随意演化众生皆不离于道也古人言曰世间性命事大修行者生老病死苦今人各不晓真道往往著空尽落空现在亦不能了何言过去之事又闻达摩经云过去非言实未来不为真太上炼九转还丹令人去病疾了生死夫子教仁义礼智信恐人招业在身令人修此亦能治其疾病'},
 {t:'第二十一',x:'问曰如何治于病疾诀曰除眼大良药解曰长大欢为良药诀曰欢喜者是药之根本常烦恼者是万病之根本或常清静者是大道之苗但见今人修行或僧道五戒男子妇人却因甚病疾无常或男子女人有夫无妇者丹田走却灵龟耗散真炁下元虚冷渐生万病男子清静六十四日精炁满女子清静四十九日血炁满物极者则返清为浊返静为动返心意散失九窍走却真气炁浊令女子月水多男子夜梦阴境盗了七珍八宝故人有疾病也'},
 {t:'第二十二',x:'问曰阴鬼如何治之答曰用刀圭之法曰何者为刀圭诀曰刀圭者一也有水有气能生万物也炁为圭为云水为雨又曰出炁为刀入炁为圭行功为万有验者为刀圭是返老还童也经云身下出火身上出水水火为药诀曰芦芽穿膝上下河车安罏灶是紫河车搬精补脑之上车进火时水暖进水时火凉水火双行者是温温铅鼎鼎中入气起休交上随车火时散入百脉皮肤滋润身体光泽此是修养之法难曰因何人肥者先衰诀曰肥人者修外不修里骨中无髓丹田走却真炁故衰病也修内道者安乐长生之苗诀曰长教龙盘金鼎虎绕丹田震卦起雷巽卦起风行功时漱津一大口分三度咽按气下行三遍自然有龙吟虎啸之声亦能除腹中万病耳听之如雷捶画鼓上者为升下者为降颂曰真空妙理无人知曲江端坐看乌飞震地雷声惊鬼魅正是阴阳造化时子后午前加减用水火烹煎龙虎随金公带酒黄婆醉拽定王公问是谁'},
 {t:'第二十三',x:'问曰金公是神黄婆是炁阳炁是婴儿阴炁是姹女青龙者是肝之炁也白虎者是肺之炁也坎离者是精血诀曰行功时坐如泰山立如宝塔牢镇四门紧叩玄关漱津一口为猛三咽下接炁过离隔活作三度自然龙虎之炁后如行住坐卧禁口闭目耳不听声眼视内景一日正观丹田意中想见随呼炁下降随吸炁上升不过离隔不教注面目上六炁各到中元相见清炁右行浊气左行各转九遭炁上下不能出左右结成罏灶号龙盘虎绕气自然和会又婴儿姹女为夫妇之法炁聚于脾上安罏号黄婆匹配之法又名天地交泰之法又名坎离交媾是体交神不交之法神不交者是清静之法千遍不摇不动之法今人者多修外道不修内道见在道过去法夫修行者外有条大道教内有正路无人知处大众前行三里见三条大涧亦无底怎生过去诀曰三条大涧者是三教三乘起三尸定三宝超三界向前又行三里见六条深沟不能前进是何门诀曰是六度万行六根清净斩六贼戒六欲树六梯向前又行三里见三产枋是宝净枋七林尸多便是临作用行三里又见一座园名为舍果园一翁看定园门有缘者空手得过向前园又行三里见一根大树上系定金牛河边上有一座台男子黄金台女子凤凰台神仙钓鱼台安乐千花台若无常望乡台河口有三个女子渡口便是魔女众满舟船过此河又行三里见一座大山名是须弥山山东坡有一只青羊是老君之炁西坡见一只白羊是夫子之炁正南见一只黄羊是大觉金仙之炁三个羊儿引接大众入山名三阳聚鼎山山中有一座城名为北城有四门门上有牌牌上有字东是开光门西是长生门南是金光门北是大沦门此是眼耳鼻口入得四门见四洞府天乐洞白云洞竹国洞长生洞入得四洞见四寺无净寺玄空寺竹林寺安禅寺有四果安禅罗汉阿那舍斯陀舍须陀洹阿罗汉为四寺主此是四果仙人也向前又见五观第一功名观第二医药观第三安阳观第四真如观第五兜率观五观中有五宫双女宫是眼大龙宫是口上白宫是鼻水晶宫是耳天秤宫是心内坐大楼阁上下十二呼吸名曰十二重楼也有中宫楼月宫楼天仙楼取宝楼圣井楼法炁楼妙音楼识道楼禅顶楼景阳楼钟鼓楼二圣楼每年十二月一日十二时人身中有十二楼楼者按经十二经十二支干四面又见九宫是人有九窍也夫九窍宫者东有风雷宫双林宫南有紫微宫牟尼宫西有圣母宫惠罗宫北有梵宫水晶宫中央号安宫此名九宫犹地列九州也又微府元共计十州也是十国焦祖国牟尼国开花国鹿岩国金色国琉璃国舍卫国南禅国天竺国重阳国十国者便是十地每一地中一座泰山身有四大海津为东海血为南海髓为西海气为北海更有九洲小肠是也更有五湖身是洞庭湖精是玉湖甘露是醍醐心为玄湖小肠为江湖日月星辰三消毒血气精衰也三消是山崩海竭地裂一日十二时辰中得坐莫越其人功成果满男子炼形如童男女子炼形如童女经云形神俱妙与道合真此是抽胎换骨之法阴阳颠倒五行真诀五行含金木水火土春木旺内木不旺人多病眼疾夏火旺内火不旺人多泻痢秋金旺内金不旺人多咳嗽冬水旺内水不旺人多疝气脾为土四季分了脾气阴阳颠倒返复也五行各有相克金克木木克土土克水水克火火克金水火者是阴阳也一阴一阳真道也精血也人有万病尽不干五脏之事都是损了父母精血丹田弱便生病疾也急收神定性九仙经云道者一也人得一者万事必成行功时神气转炁逐意行运时前赶前冲为阴左将阴神六甲驱转六相八识匡一真零内游九宫看玩十国长生降台使婴儿姹女丹田安罏灶进火烧药意想见炉红灶热丹药方成意想青龙在左白虎在右朱雀在前玄武在后四座大神各手执长枪阔剑看定药炉自服妙药若人累行此功永得长生令邪气自散真气自生口若饮荆山玉泉口中自然香甜也二下穴通达肾堂随呼气取之宝气入口嗽三十六遍为雪花咽入丹田为雪也随后便上合下闭乾坤相合真气满足脾暖者万病消除似灶中烧瓦时到自然成如鸡抱卵妇人怀胎不计时候但觉身中疼痛者便是铁黑牛搬车也是真一气真一性黑者是下气也痛气大便出肿气小便出又有降天关地轴法望顶阳关泥丸宫鼻中长引真气入口大呵作六遍天关地轴如死不动每日行功者长调和阴阳冬至日一阳生夏至日一阴生冬至者是子时以后望东方日出为阳夏至者午时以后日没是阴也阴阳返复之理也地气上腾天雨下降三日一风十朝二雨风雨顺时人民便快乐便是一身快乐无病长久也人有万病者每一病各一般真功治其病自应也第一大炼九转还丹之法有黄芽穿膝之法射九重铁鼓之法太子游四门之法有金鞭指轮之法有芦芽穿膝之法有轩辕跨火之法有玉女摸身之法有钟离背剑之法有吕翁钓鱼之法有陈希夷大睡之法三教内行法门者尽各治于疾病也更有能超生者人行转此功丹田养热真气夜间多梦见山上放牛其牛者是赤牛或青牛或仙人道士宫观寺院大道好房高车好树夜见小儿女并大官人者并是丹田气壮若梦见小道荒棘恶人趁破房屋塔墓树倒河渡恐怕并是丹田气衰弱宜用补之诀曰对三人休言说六耳恐漏神仙之机诀曰此三人者第一对夫不孝之人第二对夫不敬信之人第三对夫不传戒不善之人莫说此诀除此等人外不分男子女人僧道官人皆诸经为祖对安乐者是小乘之法虽是小乘却是大成根本因果经中俱言修行有八般福田救苦看病福田者是第一救生性强如南寺烧香北院送供救一人之命如造七级宝塔若男子女人收得此诀勿可乱传如有乱传者轻泄仙人妙机九祖尽堕于沉沦永镇酆都不得人身慎之戒之信受奉行'},
];

const c=document.getElementById('content');
LUN.forEach(l=>{
  const s=document.createElement('section');
  const h=document.createElement('div');h.className='lun-title';h.textContent=l.t;
  const p=document.createElement('div');p.className='fanwen';
  [...l.x].forEach(ch=>{const sp=document.createElement('span');sp.className='ch';sp.textContent=ch;p.appendChild(sp);});
  s.appendChild(h);s.appendChild(p);c.appendChild(s);
});
const tb=document.getElementById('traceBtn');tb.onclick=()=>{document.body.classList.toggle('trace');tb.classList.toggle('on');};
const gb=document.getElementById('gridBtn');gb.onclick=()=>{document.body.classList.toggle('no-grid');gb.classList.toggle('on');};
document.getElementById('sizeRange').oninput=e=>document.documentElement.style.setProperty('--cell',e.target.value+'px');
